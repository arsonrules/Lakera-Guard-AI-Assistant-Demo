services:
  app:
    build: .
    ports:
      # Demo has no authentication — bind to loopback only, not the whole LAN.
      - "127.0.0.1:8000:8000"
    # Config is optional — keys can be set entirely from the UI. Both files are
    # read if present (root .env for existing setups, config/.env for values the
    # UI writes back); required:false lets the app boot with neither.
    env_file:
      - path: .env
        required: false
      - path: ./config/.env
        required: false
    environment:
      # Where the UI's "Save to .env" writes. Inside the mounted config/
      # directory, so no host file has to pre-exist (Docker creates the dir).
      ENV_FILE: /app/config/.env
    volumes:
      - ./tests/fixtures:/app/tests/fixtures:ro
      # Custom doc uploads need a writable directory.
      - ./tests/fixtures/docs_custom:/app/tests/fixtures/docs_custom
      # Persists UI-saved settings to ./config/.env on the host so they load on
      # the next start. A DIRECTORY mount on purpose: bind-mounting a single
      # missing file makes Docker create a directory in its place.
      - ./config:/app/config
    # Lets the container reach an LLM server running on the host (LM Studio,
    # Ollama, oMLX) via http://host.docker.internal:<port>/v1. Docker Desktop
    # provides this automatically; this mapping also makes it work on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else sys.exit(1)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    # A 100k-row one-shot run holds its dataset in memory; cap it so a large run
    # can't take the host down. Raise if you routinely scan very large datasets.
    mem_limit: 2g
